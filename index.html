<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рейтинг ИИ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d68;--grid:#e1e0d9;
--axis:#c3c2b7;--up:#1a7f37;--down:#c62828;--line:rgba(11,11,11,.10);--accent:#1d1d1b;--accent-ink:#ffffff;--tint:#efede6;--link:#1c5cab;--chip:#e6e4dc;--shade:rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;
--ink2:#c3c2b7;--muted:#a3a29c;--grid:#2c2c2a;--axis:#383835;--up:#4cc26a;--down:#ff6b6b;--line:rgba(255,255,255,.10);--accent:#f0efec;--accent-ink:#0b0b0b;
--tint:#262624;--link:#86b6ef;--chip:#2c2c2a;--shade:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29c;
--grid:#2c2c2a;--axis:#383835;--up:#4cc26a;--down:#ff6b6b;--line:rgba(255,255,255,.10);--accent:#f0efec;--accent-ink:#0b0b0b;--tint:#262624;--link:#86b6ef;
--chip:#2c2c2a;--shade:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plane);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
a{color:var(--link)}
h1{font-size:28px;line-height:1.15;margin:4px 0 2px}
.date{font-weight:600;font-size:17px;margin:0}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;margin:14px -16px 0;padding:8px 16px;background:var(--plane);
border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;min-height:40px;padding:8px 14px;border:0;border-radius:999px;background:none;color:var(--ink2);
font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,.col:focus-visible,.row:focus-visible,.link-btn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.tabs button,.row,.close,.link-btn{-webkit-tap-highlight-color:transparent}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.change{font-size:14px;color:var(--ink2);padding:12px 14px}
.change h2{margin:0 0 6px;font-size:16px;color:var(--ink)}
.change p{margin:6px 0 0}
.news{list-style:none;margin:0;padding:0}
.news button{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;padding:8px 0;border:0;
border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;
-webkit-tap-highlight-color:transparent}
.news li:first-child button{border-top:0}
.news b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.news small{display:block;font-size:12px;color:var(--ink2)}
.news .pl{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.news .pl.top{padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px}
.chart-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px;scrollbar-width:thin}
.chart{position:relative;display:flex;min-width:calc(var(--n) * 74px)}
.grid{position:absolute;left:0;right:0;top:0;height:var(--plot);pointer-events:none}
.grid i{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.grid i.zero{border-top-color:var(--axis)}
.col{position:relative;flex:1 1 0;min-width:74px;display:flex;flex-direction:column;align-items:center;padding:0 3px 6px;
border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (hover:hover) and (pointer:fine){.col:hover .bar{filter:brightness(1.07)}.col:hover .vname{text-decoration:underline}}
.plot{height:var(--plot);width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col.lead .plot{background:var(--tint);outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px 12px 0 0}
.chip{font-size:11px;font-weight:700;line-height:1;padding:4px 7px;border-radius:999px;background:var(--chip);color:var(--ink);margin-bottom:4px}
.col.lead .chip{background:var(--accent);color:var(--accent-ink)}
.val{font-weight:700;font-size:17px;line-height:1.1;margin-bottom:4px}
.bar{display:flex;flex-direction:column;align-items:center;width:100%;max-width:56px;border-radius:8px 8px 0 0;background:var(--c);color:var(--on);overflow:hidden}
.plate{flex:none;display:grid;place-items:center;width:38px;height:38px;margin-top:9px;border-radius:9px;background:#fff;color:#000;
font:700 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 0 0 1px rgba(0,0,0,.16);overflow:hidden}
.plate img{width:26px;height:26px;object-fit:contain}
.plate.sm{width:30px;height:30px;margin:0;border-radius:8px;font-size:12px;box-shadow:0 0 0 2px var(--c)}
.plate.sm img{width:20px;height:20px}
.wm{flex:none;margin-top:9px;line-height:0}
.wm img{display:block;filter:var(--wf,none)}
.vname{flex:0 1 auto;min-height:0;margin:8px 0;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;writing-mode:vertical-rl;
overflow:hidden;text-overflow:ellipsis}
.nm{margin-top:7px;font-size:13px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.md{font-size:12px;color:var(--ink2);line-height:1.2;margin-top:1px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.tip{position:fixed;z-index:6;left:0;top:0;max-width:260px;padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--ink);
border:1px solid var(--line);border-left:5px solid var(--c);box-shadow:0 6px 22px rgba(0,0,0,.18);pointer-events:none;font-size:13px;line-height:1.35}
.tip[hidden]{display:none}
.tip b{display:block;font-size:14px}
.tip .co{display:block;color:var(--ink2);font-weight:600;margin-bottom:2px}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:6px 0 0}
.tip dt{color:var(--muted)}
.tip dd{margin:0;font-weight:600}
.search{display:block;margin:6px 0 8px}
.search input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
.count{font-size:13px;color:var(--muted);margin:0 0 6px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:36px 30px 1fr auto;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 6px;
border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.row .rk{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;line-height:1.2}
.mv{font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.mv.up{color:var(--up)}.mv.down{color:var(--down)}.mv.new{color:var(--link)}
.dl{display:block;font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dl.up{color:var(--up)}.dl.down{color:var(--down)}
.stat .dl{display:inline;font-size:12px;margin-left:4px}
.col .mv{margin-bottom:2px}
.stat .mv{display:inline;font-size:12px;margin-left:4px}
.row .nm2{font-weight:600;line-height:1.25}
.row .nm2 small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.row .sc{font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px 6px}
.foot{font-size:12px;color:var(--muted);margin:16px 0 0}
.cat{padding:12px 14px}
.cat h3{margin:0 0 4px;font-size:14px;color:var(--ink2);font-weight:600}
.cat .pick{font-size:19px;font-weight:700;margin:0;line-height:1.25}
.cat .pick.none{font-size:16px;color:var(--muted)}
.tag{display:inline-block;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--chip);
color:var(--ink);font-size:12px;font-weight:600}
.cat .why{margin:4px 0 0;color:var(--ink2)}
.cat .foot-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 16px;margin-top:6px}
.link-btn{border:0;background:none;color:var(--link);font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;padding:6px 0;cursor:pointer;
touch-action:manipulation;-webkit-tap-highlight-color:transparent}
details.more{font-size:13px;color:var(--ink2)}
details.more[open]{flex-basis:100%}
details.more summary{cursor:pointer;color:var(--link);font-weight:600;font-size:14px;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ›"}
details.more[open] summary::after{content:" ⌄"}
details.more p{margin:6px 0 0}
details.more ul{margin:6px 0 0;padding-left:18px}
details.more li{margin:4px 0}
.sheet{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:var(--shade)}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
border-radius:16px 16px 0 0}
.panel .inner{padding:0 16px calc(28px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:16px}}
.panel .top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:18px 10px 10px 16px;background:var(--surface);
border-radius:16px 16px 0 0}
.panel .top::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--axis)}
.panel .top .plate{margin:0;box-shadow:0 0 0 3px var(--c)}
.panel h2{flex:1;min-width:0;margin:0;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.close{border:0;background:var(--chip);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;flex:none;touch-action:manipulation}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.stat{background:var(--tint);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.panel h3{font-size:14px;margin:16px 0 6px}
.kv dd.id{font:12px ui-monospace,Consolas,monospace;color:var(--ink2)}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.mode{padding:4px 10px;border-radius:999px;background:var(--chip);font-size:13px}
.mode.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.checks .t{min-width:0;overflow-wrap:anywhere}
.checks .t a{color:inherit;text-decoration-color:var(--axis)}
.checks .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.checks .m{grid-column:1/-1;font-size:12px;color:var(--muted)}
.win{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
font-size:11px;font-weight:700;vertical-align:1px}

<body><main>
<header><h1>Рейтинг ИИ</h1><p class="date" id="date"></p><p class="sub" id="sub"></p></header>
<nav class="tabs" role="tablist" aria-label="Разделы"><button type="button" role="tab" data-tab="general" aria-controls="tab-general">Общий</button><button type="button" role="tab" data-tab="routine" aria-controls="tab-routine">Рутина</button><button type="button" role="tab" data-tab="study" aria-controls="tab-study">Учёба</button><button type="button" role="tab" data-tab="other" aria-controls="tab-other">Другие</button></nav>
<section id="tab-general" role="tabpanel">
<div class="card change" id="change" aria-live="polite"></div>
<div class="card"><div class="chart-wrap" id="chart-wrap"><div class="chart" id="chart" role="list" aria-label="Верхние позиции рейтинга"></div></div>

<label class="search"><span class="sub">Поиск по всем моделям снимка</span>
<input id="q" type="search" placeholder="Например, opus или kimi" autocomplete="off"></label>
<p class="count" id="count"></p><ol class="list" id="list"></ol>
<p class="foot">Баллы и места — Artificial Analysis Intelligence Index v5. У каждой модели показан её лучший режим, остальные — в карточке. Вкладки «Рутина», «Учёба», «Другие» считаются по открытым тестам.</p>
</section>
<section id="tab-routine" role="tabpanel" hidden><div id="cats-routine"></div></section><section id="tab-study" role="tabpanel" hidden><div id="cats-study"></div></section><section id="tab-other" role="tabpanel" hidden><div id="cats-other"></div></section>
</main>

  n.append(...nodes(kids));
  return n;
}
// вложенные массивы раскрываются, пустые значения пропускаются (replaceChildren и append сами этого не делают)
const nodes = kids => kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false)
  .map(k => k instanceof Node ? k : document.createTextNode(String(k)));
// ссылки только http(s): адреса приходят из данных источников
const ext = (href, text) => /^https?:\/\//i.test(href || '') ? el('a', {href, target: '_blank', rel: 'noopener noreferrer', text})
                                                              : el('span', {text});
const byKey = new Map(D.models.map(m => [m.key, m]));

// ---------- шапка ----------
document.getElementById('date').textContent = D.date_text;
document.getElementById('sub').textContent = D.subtitle;

// ---------- вкладки ----------
const tabs = [...document.querySelectorAll('.tabs button')];
function show(id, focus) {
  for (const b of tabs) {
    const on = b.dataset.tab === id;
    b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
    document.getElementById('tab-' + b.dataset.tab).hidden = !on;
    if (on && focus) b.focus();
  }
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
tabs.forEach((b, i) => {
  b.addEventListener('click', () => show(b.dataset.tab));
  b.addEventListener('keydown', e => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (d) { e.preventDefault(); show(tabs[(i + d + tabs.length) % tabs.length].dataset.tab, true); }
  });
});

// ---------- общий: изменения ----------
const change = document.getElementById('change');


// ---------- общий: график ----------
const chart = document.getElementById('chart');
const top = D.models.slice(0, D.chart_n);
const PLOT = 320, BARS = 260;                 // высота области столбиков и самого высокого возможного столбика, px
const PLATE = 47, NAME_MIN = 44;              // плашка с отступами; если на название не хватает места, его не показываем
chart.style.setProperty('--n', top.length);
chart.style.setProperty('--plot', PLOT + 'px');
const grid = el('div', {class: 'grid', 'aria-hidden': 'true'});
for (let v = 0; v <= D.ymax; v += D.ystep)
  grid.append(el('i', {class: v ? '' : 'zero', style: `bottom:${(v / D.ymax) * BARS}px`}));
chart.append(grid);

// плашка разработчика: логотип из локального файла (встроен в страницу) или инициалы названия компании из данных
const DATA_IMG = /^data:image\/(png|webp|jpeg);base64,[A-Za-z0-9+\/=]+$/;
const plate = (m, small) => {
  const logo = (D.devs[m.dev] || {}).logo || '';
  return el('span', {class: 'plate' + (small ? ' sm' : ''), 'aria-hidden': 'true'},
            DATA_IMG.test(logo) ? el('img', {src: logo, alt: ''}) : m.initials);
};

// ---------- подсказка: только мышь и клавиатура; на касание столбик сразу открывает карточку ----------
const tip = document.getElementById('tip');
function showTip(m, x, y) {
  tip.className = 'tip dev-' + m.dev;
  tip.replaceChildren(...nodes([
    el('span', {class: 'co', text: m.developer}), el('b', {text: m.name}),
    el('dl', {}, m.mode ? [el('dt', {text: 'Режим'}), el('dd', {text: m.mode})] : null,
      el('dt', {text: 'Место'}), el('dd', {text: m.place_text}),
      el('dt', {text: 'Балл'}), el('dd', {text: m.score_text}))]));
  tip.hidden = false;
  placeTip(x, y);
}
function placeTip(x, y) {
  const w = tip.offsetWidth, h = tip.offsetHeight, pad = 8;
  let left = x + 16, topPx = y + 16;
  if (left + w > innerWidth - pad) left = x - w - 16;
  if (topPx + h > innerHeight - pad) topPx = y - h - 16;
  tip.style.left = Math.max(pad, left) + 'px'; tip.style.top = Math.max(pad, topPx) + 'px';
}
const hideTip = () => { tip.hidden = true; };
function tipEvents(node, m) {
  node.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') showTip(m, e.clientX, e.clientY); });
  node.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && !tip.hidden) placeTip(e.clientX, e.clientY); });
  node.addEventListener('pointerleave', hideTip);
  node.addEventListener('focus', () => {
    let keyboard = false;
    try { keyboard = node.matches(':focus-visible'); } catch (e) {}
    if (keyboard) { const r = node.getBoundingClientRect(); showTip(m, r.left + r.width / 2, r.top + 48); }
  });
  node.addEventListener('blur', hideTip);
}

// фирменная надпись вдоль столбика: исходные пропорции и цвета (картинка уже повернута сверху вниз); если файла нет или
// надпись выходит мельче порога — null, и на столбике остаётся название компании обычным шрифтом
const BAR_W = 56, WM_TOP = 9, WM_BOTTOM = 10;                   // ширина столбика и отступы надписи, px
function wordmarkFor(m, barH) {
  const dv = D.devs[m.dev] || {}, wm = dv.wordmark;
  if (!wm || !DATA_IMG.test(wm.src || '')) return null;
  const icon = dv.icon !== false;                                // у Meta знак уже в надписи — значок не повторяется
  const room = Math.min(D.brand.wordmark_max_length * BAR_W, barH - (icon ? PLATE : 0) - WM_TOP - WM_BOTTOM);
  const ar = wm.w / wm.h;
  const thick = Math.min(D.brand.wordmark_max_width * BAR_W, room * ar);
  if (!(thick / (dv.lines || 1) >= D.brand.wordmark_min_px)) return null;
  return {src: wm.src, icon, w: Math.round(thick), h: Math.round(thick / ar)};
}

// сдвиг места с прошлого выпуска: зелёная ▲ — поднялась, красная ▼ — опустилась, «нов.» — не было; на месте — ничего
function moveMark(m) {
  if (m.new) return el('span', {class: 'mv new', text: 'нов.', title: 'Новая в рейтинге'});
  if (!m.move) return null;
  const up = m.move > 0, n = Math.abs(m.move);
  return el('span', {class: 'mv ' + (up ? 'up' : 'down'), text: (up ? '▲' : '▼') + n,
                     title: `${up ? 'Поднялась' : 'Опустилась'} на ${n} с выпуска ${D.moves_since}`});
}
// изменение балла с вчерашнего выпуска: стала умнее (+) или слабее (−); без изменения — ничего
const deltaMark = m => m.delta ? el('span', {class: 'dl ' + (m.delta > 0 ? 'up' : 'down'), text: m.delta_text,
                                             title: `Балл ${m.delta > 0 ? 'вырос' : 'снизился'} с выпуска ${D.moves_since}`}) : null;
const moveText = m => m.new ? 'новая в рейтинге' : m.move ? `${m.move > 0 ? 'поднялась' : 'опустилась'} на ${Math.abs(m.move)} с ${D.moves_since}` : '';

for (const m of top) {
  const label = `${m.developer}: ${m.name}${m.mode ? ', режим ' + m.mode : ''}: ${m.score_text}, ${m.place_text}${moveText(m) ? ', ' + moveText(m) : ''}`;
  const h = Math.max(2, (m.score / D.ymax) * BARS);
  const wm = wordmarkFor(m, h);
  const col = el('button', {class: 'col dev-' + m.dev + (m.rank === 1 ? ' lead' : ''), type: 'button', role: 'listitem',
                            'aria-label': label, onclick: () => openCard(m.key)},
    el('span', {class: 'plot'},
      m.badge ? el('span', {class: 'chip', text: m.badge}) : null,
      moveMark(m),
      el('span', {class: 'val', text: m.score_text}),
      el('span', {class: 'bar', style: `height:${h}px`}, !wm || wm.icon ? plate(m) : null,
        wm ? el('span', {class: 'wm', 'aria-hidden': 'true'}, el('img', {src: wm.src, alt: '', style: `width:${wm.w}px;height:${wm.h}px`}))
           : h - PLATE >= NAME_MIN ? el('span', {class: 'vname', text: m.developer}) : null)),
    el('span', {class: 'nm', text: m.name}),
    m.mode ? el('span', {class: 'md', text: m.mode}) : null);
  tipEvents(col, m);
  chart.append(col);
}
const wrap = document.getElementById('chart-wrap');
const hint = document.getElementById('hint');
const fit = () => { hint.hidden = wrap.scrollWidth <= wrap.clientWidth + 2; };
window.addEventListener('resize', fit); fit();
wrap.addEventListener('scroll', hideTip, {passive: true});

// ---------- общий: новости (после графика в коде: нужны plate и openCard; на странице — наверху) ----------
// новости: что вышло за последние дни (дата выпуска AA) и что изменилось с прошлого опубликованного выпуска
const when = n => n.days === 0 ? 'сегодня' : n.days === 1 ? 'вчера' : n.date_text;
const fresh = D.news.filter(n => byKey.has(n.key));
change.append(el('h2', {text: 'Новости'}));
if (fresh.length) change.append(el('ul', {class: 'news'}, fresh.map(n => {
  const m = byKey.get(n.key);
  return el('li', {}, el('button', {type: 'button', class: 'dev-' + m.dev, onclick: () => openCard(m.key),
                                    'aria-label': `Новая модель ${m.name}, вышла ${when(n)}, ${m.place_text}`},
    plate(m, true),
    el('span', {}, el('b', {text: `🆕 ${m.name}`}), el('small', {text: `${m.developer} · вышла ${when(n)}`})),
    el('span', {class: 'pl' + (m.rank <= 3 ? ' top' : ''), text: `${m.rank}-е место`})));
})));
else change.append(el('p', {text: `За последние ${D.news_days} дней новых моделей в рейтинге нет.`}));
for (const line of D.change_lines) change.append(el('p', {text: line}));

// ---------- общий: поиск и полный список ----------
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[\s\-_.()]+/g, '');
const list = document.getElementById('list'), count = document.getElementById('count'), q = document.getElementById('q');
function renderList() {
  const query = norm(q.value || '');
  const found = D.models.filter(m => !query || m.search.includes(query));
  list.replaceChildren(...found.map(m => el('li', {},
    el('button', {class: 'row dev-' + m.dev, type: 'button', onclick: () => openCard(m.key)},
      el('span', {class: 'rk'}, m.place_short, moveMark(m)), plate(m, true),
      el('span', {class: 'nm2'}, m.name, el('small', {text: [m.developer, m.mode].filter(Boolean).join(' · ')})),
      el('span', {class: 'sc'}, m.score_text, deltaMark(m))))));
  if (!found.length) list.append(el('li', {class: 'empty', text: 'Ничего не найдено. Попробуйте часть названия: «opus», «gemini», «kimi».'}));
  count.textContent = query ? `Найдено: ${found.length} из ${D.models.length}`
    : `Все ${D.models.length} моделей с баллом Artificial Analysis (у AA ${D.entries_total} записей: режимы одной модели собраны в одну строку)`
      + (D.moves_since ? `. ▲▼ и ±балл — изменения со вчерашнего выпуска (${D.moves_since})` : '');
}
q.addEventListener('input', renderList); renderList();

// ---------- категории: задача, модель, одна фраза; доказательства и пояснения — в «Подробнее» ----------
for (const tab of D.tabs) {
  const box = document.getElementById('cats-' + tab.id);
  for (const c of tab.categories) {
    const card = el('article', {class: 'card cat'}, el('h3', {text: `${c.emoji} ${c.title}`}));
    const p = c.pick, m = p && p.model_key ? byKey.get(p.model_key) : null;
    if (p) {
      card.append(el('p', {class: 'pick'}, p.model, p.provisional ? el('span', {class: 'tag', text: 'мало данных'}) : null),
                  el('p', {class: 'why', text: p.phrase}));
    } else {
      card.append(el('p', {class: 'pick none', text: 'Пока нет данных'}));
    }
    const more = nodes([
      p ? el('p', {}, 'Главный довод: ', ext(p.test_url, `${p.test} — ${p.result}`)) : null,
      c.notes.map(n => el('p', {text: n})),
      c.evidence.length > 1 ? [el('p', {text: 'Все результаты модели:'}),
        el('ul', {}, c.evidence.map(e => el('li', {}, `${e.test}: ${e.result} `, ext(e.url, '↗'))))] : null]);
    const row = el('div', {class: 'foot-row'},
      m ? el('button', {class: 'link-btn', type: 'button', text: `${m.rank}-е место в общем рейтинге ›`,
                        onclick: () => openCard(m.key)}) : null,
      more.length ? el('details', {class: 'more'}, el('summary', {text: 'Подробнее'}), more) : null);
    if (row.childNodes.length) card.append(row);
    box.append(card);
  }
  if (!tab.categories.length) box.append(el('p', {class: 'card', text: 'Пока нет данных для этой вкладки.'}));
}

// ---------- карточка модели ----------
const sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
let lastFocus = null;
function closeCard() {
  sheet.hidden = true;
  if (inTelegram) { try { tg.BackButton.hide(); tg.BackButton.offClick(closeCard); } catch (e) {} }
  if (lastFocus) lastFocus.focus();
}
function openCard(key) {
  const m = byKey.get(key); if (!m) return;
  hideTip();
  lastFocus = document.activeElement;
  const best = m.entries[0];
  const close = el('button', {class: 'close', type: 'button', 'aria-label': 'Закрыть', text: '✕', onclick: closeCard});
  const head = el('div', {class: 'top'}, plate(m), el('h2', {id: 'card-title', text: m.name}), close);
  // свайп вниз по шапке тоже закрывает карточку
  let swipeY = null;
  head.addEventListener('touchstart', e => { swipeY = e.touches[0].clientY; }, {passive: true});
  head.addEventListener('touchend', e => { if (swipeY !== null && e.changedTouches[0].clientY - swipeY > 60) closeCard(); swipeY = null; });
  // сначала главное (место и балл), потом режимы и результаты в других тестах; технические поля — в «Подробнее».
  // Место модели в чужом тесте не показывается (его путали с местом в рейтинге) — только пометка «№1 в тесте».
  const tests = m.entries.flatMap(e => e.checks.map(c => ({...c, entryMode: e.mode})));
  const manyModes = new Set(tests.map(c => c.entryMode)).size > 1;
  panel.className = 'panel dev-' + m.dev;
  panel.replaceChildren(head, el('div', {class: 'inner'}, ...nodes([
    el('p', {class: 'sub', text: m.developer}),
    el('div', {class: 'stats'},
      el('div', {class: 'stat'}, el('span', {text: 'Место в рейтинге'}), el('b', {text: m.place_short}),
         el('small', {}, `из ${D.models.length}${m.tied ? ', общее с другой моделью' : ''}`, moveMark(m))),
      el('div', {class: 'stat'}, el('span', {text: 'Балл'}), el('b', {text: m.score_text}),
         el('small', {}, m.mode ? 'режим ' + m.mode : D.index_label, deltaMark(m)))),
    m.entries.length > 1 ? [el('h3', {text: 'Другие режимы'}),
      el('p', {class: 'modes'}, m.entries.slice(1).map(e =>
        el('span', {class: 'mode'}, `${e.mode || 'без режима'} `, el('b', {text: e.score_text}))))] : null,
    tests.length ? [el('h3', {text: 'Результаты в других тестах'}),
      el('ul', {class: 'checks'}, tests.map(c => el('li', {},
        el('span', {class: 't'}, ext(c.url, c.test), c.rank === 1 ? el('span', {class: 'win', text: '№1 в тесте'}) : null),
        el('span', {class: 'v', text: c.result.split(', ')[0]}),
        manyModes ? el('span', {class: 'm', text: 'режим ' + (c.entryMode || 'без режима')}) : null)))] : null,
    el('details', {class: 'more'}, el('summary', {text: 'Подробнее'}),
      el('dl', {class: 'kv'},
        el('dt', {text: 'Точное имя'}), el('dd', {text: best.name}),
        best.release_date ? [el('dt', {text: 'Выпущена'}), el('dd', {text: best.release_date})] : null,
        el('dt', {text: 'Данные на'}), el('dd', {text: D.snapshot_text}),
        el('dt', {text: 'Идентификатор'}), el('dd', {class: 'id', text: best.id})),
      el('p', {}, 'Место и балл — ', ext(D.leaderboard_url, `${D.publisher}, ${D.index_label}`),
         '. Другие тесты показаны, только если там та же версия и режим; на место в рейтинге они не влияют.'))])));
  sheet.hidden = false;
  panel.scrollTop = 0;
  close.focus();
  if (inTelegram) { try { tg.BackButton.show(); tg.BackButton.onClick(closeCard); } catch (e) {} }
}
sheet.addEventListener('click', e => { if (e.target === sheet) closeCard(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); if (!sheet.hidden) closeCard(); } });

const start = (location.hash || '').slice(1);
show(tabs.some(b => b.dataset.tab === start) ? start : 'general');
})();
</script>
</body></html>
